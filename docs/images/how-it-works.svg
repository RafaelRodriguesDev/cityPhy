<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How cityPhy works</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7a8599" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="16" fill="#0f1420"/>

  <!-- inputs -->
  <text x="40" y="44" fill="#8f9bb3" font-size="13">ON YOUR MACHINE (read-only)</text>
  <g>
    <rect x="40" y="60" width="230" height="74" rx="10" fill="#14302a" stroke="#2bb39a"/>
    <text x="155" y="92" fill="#e8ecf5" font-size="16" font-weight="600" text-anchor="middle">Your projects</text>
    <text x="155" y="114" fill="#9fe1cb" font-size="13" text-anchor="middle">source code</text>
  </g>
  <g>
    <rect x="40" y="160" width="230" height="74" rx="10" fill="#241f45" stroke="#8b7cf6"/>
    <text x="155" y="192" fill="#e8ecf5" font-size="16" font-weight="600" text-anchor="middle">AI agent folders</text>
    <text x="155" y="214" fill="#cecbf6" font-size="13" text-anchor="middle">rules · memory · skills · sessions</text>
  </g>
  <g>
    <rect x="40" y="260" width="230" height="74" rx="10" fill="#3a2a12" stroke="#e0a64a"/>
    <text x="155" y="292" fill="#e8ecf5" font-size="16" font-weight="600" text-anchor="middle">Agent hooks / logs</text>
    <text x="155" y="314" fill="#fac775" font-size="13" text-anchor="middle">what happens in each session</text>
  </g>

  <!-- processors -->
  <g>
    <rect x="360" y="60" width="240" height="74" rx="10" fill="#1a2233" stroke="#5f6b85"/>
    <text x="480" y="92" fill="#e8ecf5" font-size="16" font-weight="600" text-anchor="middle">graphify</text>
    <text x="480" y="114" fill="#a9b3c7" font-size="13" text-anchor="middle">local AST graph, no LLM</text>
  </g>
  <g>
    <rect x="360" y="160" width="240" height="74" rx="10" fill="#1a2233" stroke="#5f6b85"/>
    <text x="480" y="192" fill="#e8ecf5" font-size="16" font-weight="600" text-anchor="middle">Tower generators</text>
    <text x="480" y="214" fill="#a9b3c7" font-size="13" text-anchor="middle">names · sizes · links (no content)</text>
  </g>
  <g>
    <rect x="360" y="260" width="240" height="74" rx="10" fill="#1a2233" stroke="#5f6b85"/>
    <text x="480" y="292" fill="#e8ecf5" font-size="16" font-weight="600" text-anchor="middle">Local memory</text>
    <text x="480" y="314" fill="#a9b3c7" font-size="13" text-anchor="middle">SQLite · rule-based summaries</text>
  </g>

  <line x1="272" y1="97" x2="356" y2="97" stroke="#7a8599" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="272" y1="197" x2="356" y2="197" stroke="#7a8599" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="272" y1="297" x2="356" y2="297" stroke="#7a8599" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- output -->
  <g>
    <rect x="690" y="60" width="230" height="274" rx="12" fill="#101a2b" stroke="#5fd3ff" stroke-width="1.5"/>
    <text x="805" y="96" fill="#e8ecf5" font-size="18" font-weight="600" text-anchor="middle">cityPhy</text>
    <text x="805" y="118" fill="#8f9bb3" font-size="13" text-anchor="middle">127.0.0.1:5190</text>
    <text x="712" y="160" fill="#cfd6e4" font-size="14">• condominium per project</text>
    <text x="712" y="188" fill="#cfd6e4" font-size="14">• tower per AI agent</text>
    <text x="712" y="216" fill="#cfd6e4" font-size="14">• power lines on lamp posts</text>
    <text x="712" y="244" fill="#cfd6e4" font-size="14">• token weight per floor</text>
    <text x="712" y="272" fill="#cfd6e4" font-size="14">• tokens saved per query</text>
    <text x="712" y="300" fill="#cfd6e4" font-size="14">• memory per project</text>
  </g>
  <path d="M602 97 C 645 97, 650 150, 686 160" fill="none" stroke="#7a8599" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="602" y1="197" x2="686" y2="197" stroke="#7a8599" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M602 297 C 645 297, 650 250, 686 240" fill="none" stroke="#7a8599" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- loop back to agents -->
  <path d="M480 336 L480 380 L155 380 L155 338" fill="none" stroke="#e0a64a" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="318" y="404" fill="#fac775" font-size="13" text-anchor="middle">agents query the graph and the memory instead of re-reading whole files</text>
</svg>
